<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zayan House — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F1C1A;--paper:#FBF8F2;--panel:#fff;--gold:#B98B3E;--line:#EAE3D6;--muted:#8A8178;--warn:#B54545;--ok:#2E7D4F;
--c1:#DCE8DA;--c1t:#3B6B54;--c2:#DCE6F2;--c2t:#35577E;--c3:#F2E0D3;--c3t:#8C5A34;--c4:#E7E1F0;--c4t:#5B4D8C;--brand:#0E3B2E;
--font:'Inter','Noto Sans Bengali',-apple-system,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
:root[data-theme="dark"]{--ink:#1F1C1A;--paper:#F7F5F0;--panel:#fff;}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;flex-shrink:0;}
#sidebar{width:252px;background:var(--panel);border-right:1px solid var(--line);flex-shrink:0;padding:20px 0;overflow-y:auto;transition:transform .2s;}
#sidebar .logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;padding:2px 20px 20px;}
#sidebar .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);}
#sidebar .logo span{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-left:2px;}
.navgroup{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:16px 20px 7px;}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 20px;margin:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink);cursor:pointer;}
.navitem:hover{background:var(--paper);}
.navitem.active{background:var(--brand);color:#fff;font-weight:600;}
.navitem.active svg{color:var(--gold);}
#overlay{display:none;}
#main{flex:1;min-width:0;}
#topbar{position:sticky;top:0;background:rgba(247,245,240,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 22px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;z-index:10;gap:12px;}
#topbar .title{font-size:17px;font-weight:700;}
#topbar .sub{font-size:11.5px;color:var(--muted);}
#topbar .right{display:flex;align-items:center;gap:12px;font-size:13px;}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8C6A2D);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
#hamb{display:none;background:none;border:0;font-size:18px;}
.viewbtn{border:1px solid var(--line);padding:9px 16px;border-radius:24px;font-size:12px;font-weight:600;background:var(--panel);display:flex;align-items:center;gap:6px;}
.viewbtn:hover{background:var(--paper);}
#content{padding:22px;max-width:1140px;margin:0 auto;}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;transition:box-shadow .2s,transform .2s;}
.stat:hover{box-shadow:0 14px 28px rgba(31,28,26,.08);transform:translateY(-2px);}
.stat .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat .n{font-size:24px;font-weight:700;margin-top:8px;}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
.stat .trend{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.stat .trend.up{background:#E4F0E8;color:var(--ok);}
.stat .trend.down{background:#F5E3E3;color:var(--warn);}
.stat .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.panel-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px;}
.panel-card .headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.panel-card h3{margin:0;font-size:14.5px;font-weight:700;}
.panel-card .desc{font-size:12px;color:var(--muted);margin:0 0 14px;}
.filterrow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filterrow input,.filterrow select{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12.5px;background:var(--paper);color:var(--ink);}
.filterrow input{flex:1;min-width:140px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
tbody tr:hover{background:var(--paper);}
.pill{font-size:10.5px;padding:4px 10px;border-radius:20px;font-weight:600;}
.pill.pending{background:#F3E3D3;color:#8C5A1E;}
.pill.confirmed{background:#DDEBE1;color:var(--ok);}
.pill.delivered{background:#DCE7F2;color:#2E5C8C;}
.pill.cancelled{background:#F5E3E3;color:var(--warn);}
.activity{display:flex;gap:10px;font-size:12.5px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line);}
.activity .t{color:var(--muted);font-size:11px;white-space:nowrap;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;margin-bottom:6px;font-weight:600;}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;background:var(--paper);color:var(--ink);font-family:inherit;}
.swatch{display:inline-block;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);vertical-align:middle;margin-right:8px;}
.toggle{position:relative;width:40px;height:22px;background:var(--line);border-radius:12px;display:inline-block;cursor:pointer;flex-shrink:0;}
.toggle.on{background:var(--gold);}
.toggle .dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
.toggle.on .dot{left:20px;}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
.rowline:last-child{border-bottom:0;}
.draghandle{color:var(--muted);margin-right:10px;cursor:grab;}
.savebar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 22px;display:flex;justify-content:flex-end;gap:8px;margin:0 -22px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:0 0 14px 14px;}
.btn{background:var(--ink);color:#fff;border:0;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:40;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:30;box-shadow:0 0 30px rgba(0,0,0,.2);}
  #sidebar.open{transform:translateX(0);}
  #overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;}
  #hamb{display:block;} .viewbtn span{display:none;}
}
</style>
</head>

function icon(id,cls){return '<svg class="'+(cls||'i')+'"><use href="#'+id+'"/></svg>';}
function renderNav(){
  var root=document.getElementById("navroot");root.innerHTML="";
  NAV.forEach(function(g){
    var gd=document.createElement("div");gd.className="navgroup";gd.textContent=g.group;root.appendChild(gd);
    g.items.forEach(function(it){
      var d=document.createElement("div");d.className="navitem"+(it.id===current?" active":"");

      d.onclick=function(){current=it.id;renderNav();renderContent();toggleSidebar(false);};
      root.appendChild(d);
    });
  });
}
function findLabel(id){for(var g of NAV)for(var it of g.items)if(it.id===id)return it.label;return id;}
function toggleSidebar(force){

}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove("show");},2200);}
function sparkline(pts,color){
  var w=100,h=32,max=Math.max.apply(null,pts),min=Math.min.apply(null,pts);
  var pd=pts.map(function(p,i){var x=i/(pts.length-1)*w;var y=h-((p-min)/((max-min)||1))*h;return x+","+y;}).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:64px;height:22px;overflow:visible"><polyline points="'+pd+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

    '<div class="panel-card"><h3>Recent Activity</h3>'+

  if(["orders","products","collections","customers","inventory","reports"].indexOf(current)>-1){
    document.getElementById("pageSub").textContent="Full management screen — detailed build in Phase 5";
    c.innerHTML='<div class="panel-card"><div class="filterrow"><input type="text" placeholder="Search '+findLabel(current).toLowerCase()+'..." onfocus="toast(\'Demo: search not connected\')"><select onchange="toast(\'Demo: filter not connected\')"><option>All Status</option></select><button class="btn ghost" onclick="toast(\'Demo: export not connected\')">Export</button></div>'+
    '<table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>'+
    '<tr><td>ZC-1042</td><td>Farhana R.</td><td>৳1,890</td><td><span class="pill pending">Pending</span></td></tr>'+
    '<tr><td>ZC-1041</td><td>Kamal H.</td><td>৳3,200</td><td><span class="pill confirmed">Confirmed</span></td></tr>'+

    '</table><p class="desc" style="margin-top:12px">This module\'s full CRUD interface follows this same layout — built out in Phase 5 once the database is connected.</p></div>';
    return;
  }
  document.getElementById("pageSub").textContent="SMC module — settings shown are visual demo only";
  var mod=SETTINGS_FIELDS[current];
  if(!mod){c.innerHTML='<div class="panel-card"><p class="desc">Module layout follows the same pattern as other SMC screens.</p></div>';return;}
  var html='<div class="panel-card"><h3>'+findLabel(current)+'</h3><p class="desc">'+mod.sub+'</p>';
  if(mod.drag){mod.drag.forEach(function(s){html+='<div class="rowline"><span><span class="draghandle">⠿</span>'+s+'</span><span class="toggle on" onclick="this.classList.toggle(\'on\')"><span class="dot"></span></span></div>';});}
  else{mod.fields.forEach(function(f){html+=fieldHTML(f);});}
  html+='</div>';
  c.innerHTML=html+'<div class="savebar"><button class="btn ghost" onclick="toast(\'Demo: changes discarded\')">Cancel</button><button class="btn" onclick="toast(\'Demo: Save is not connected to a database yet\')">Save Changes</button></div>';
}
var CHIP_ROT=[["--c3","--c3t"],["--c2","--c2t"],["--c1","--c1t"],["--c4","--c4t"],["--c3","--c3t"],["--c2","--c2t"]];
function statCard(label,num,trendTxt,dir,iconId,pts,idx){
  var ch=CHIP_ROT[idx%CHIP_ROT.length];
  var style='background:var('+ch[0]+');color:var('+ch[1]+')';
  return '<div class="stat"><div class="top"><span class="ic" style="'+style+'">'+icon(iconId)+'</span><span class="trend '+dir+'">'+trendTxt+'</span></div><div class="n">'+num+'</div><div class="l">'+label+'</div>'+sparkline(pts,dir==="up"?"#2E7D4F":"#B54545")+'</div>';
}
renderNav();renderContent();
</script>
